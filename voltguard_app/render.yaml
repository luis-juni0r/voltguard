# Deploy do VoltGuard no Render (https://render.com) — "Blueprint"
# New + > Blueprint > conectar o repositório GitHub > Apply
services:
  - type: web
    name: voltguard-shekinah        # vira https://voltguard-shekinah.onrender.com
    runtime: python
    plan: free                      # troque para "starter" se quiser disco persistente
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: MQTT_BROKER
        value: broker.hivemq.com
      - key: MQTT_TOPIC_PREFIX
        value: voltguard/shekinah-2026
      - key: VOLTGUARD_LOCAL
        value: Panificadora e Confeitaria Shekinah
      - key: VOLTGUARD_API_KEY
        value: ""                   # coloque uma senha aqui se quiser proteger /api/leitura
      # Com plano pago, descomente para o banco sobreviver aos redeploys:
      # - key: VOLTGUARD_DB_DIR
      #   value: /var/data
    # disk:
